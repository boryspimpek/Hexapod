<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUADRO - quadruped robot simulator</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="c" aria-label="Trójwymiarowy podgląd robota"></canvas>
<aside id="panel">
<h1>QUADRO - quadruped robot simulator</h1>
<h2>Control</h2>
<p>Use leftstick or wsad to move.</p>
<p id="padname" class="sub">Keyboard</p>
<button id="pause">Pause</button> <button id="reset">Neutral position</button>
<h2>Calculation Status</h2><p id="status" role="status">Connecting...</p>
<h2>Servo angles (°)</h2>
<table id="tbl"><thead><tr><th>Leg</th><th>coxa</th><th>femur</th><th>tibia</th></tr></thead><tbody></tbody></table>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if (!window.THREE) document.getElementById('status').textContent = 'Nie udało się pobrać Three.js. Sprawdź połączenie z Internetem.';</script>
<script src="sim.js"></script>
</body></html>
