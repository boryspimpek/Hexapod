<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>S9-404 robot simulator</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="c" aria-label="Trójwymiarowy podgląd robota"></canvas>
<canvas id="topview" aria-label="Widok z góry: wielokąt podparcia i rzut środka ciężkości"></canvas>
<aside id="panel">
<header class="panel-header"><h1>S9-404</h1><p class="sub">Quadruped robot simulator</p></header>
<p id="status" role="status">Connecting...</p>
<section class="panel-section" aria-labelledby="stability-heading">
<h2 id="stability-heading">Stability <span class="unit" id="chart-title">vs gait phase</span></h2>
<canvas id="margin-chart" aria-label="Wykres stabilności w funkcji fazy chodu"></canvas>
<table id="stability-stats"><caption id="stats-caption">Walk to collect data</caption><tbody>
<tr><th scope="row" id="stat-a-label">—</th><td id="stat-a">—</td></tr>
<tr><th scope="row" id="stat-c-label">—</th><td id="stat-c">—</td></tr></tbody></table>
</section>
<section class="panel-section" aria-labelledby="world-heading">
<h2 id="world-heading">World movement</h2>
<label class="gait-toggle"><input id="follow-camera" type="checkbox" checked> Follow robot</label>
<label class="gait-toggle"><input id="show-support" type="checkbox" checked> Support polygon / CoM</label>
<div class="view-mode" role="radiogroup" aria-label="View"><label><input type="radio" name="view-mode" value="3d"> 3D</label><label><input type="radio" name="view-mode" value="inset" checked> 3D + 2D</label><label><input type="radio" name="view-mode" value="2d"> 2D full</label></div>
<p class="support-legend"><span class="ok">■</span> stable <span class="near">■</span> margin &lt; 10 mm or line <span class="out">■</span> CoM outside</p>
<button id="reset-position" type="button">Reset position</button>
</section>
<section class="panel-section" aria-labelledby="gait-heading">
<h2 id="gait-heading">Gait parameters</h2>
<label for="gait-select">Gait</label>
<select id="gait-select" aria-label="Gait"></select>
<div id="gait-parameters"></div>
</section>
<section class="panel-section" aria-labelledby="angles-heading">
<h2 id="angles-heading">Joint angles <span class="unit">°</span></h2>
<p class="angle-legend">Requested → after limit; Δ = limit adjustment.</p>
<table id="tbl"><thead><tr><th>Leg</th><th>coxa</th><th>femur</th><th>tibia</th></tr></thead><tbody></tbody></table>
</section>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if (!window.THREE) document.getElementById('status').textContent = 'Nie udało się pobrać Three.js. Sprawdź połączenie z Internetem.';</script>
<script src="sim.js"></script>
</body></html>
