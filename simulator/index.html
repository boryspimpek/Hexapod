<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT-404 APEX robot simulator</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="c" aria-label="Trójwymiarowy podgląd robota"></canvas>
<aside id="panel">
<header class="panel-header"><h1>MT-404 APEX</h1><p class="sub">Quadruped robot simulator</p></header>
<section class="panel-section" aria-labelledby="status-heading">
<h2 id="status-heading">Calculation Status</h2><p id="status" role="status">Connecting...</p>
</section>
<section class="panel-section" aria-labelledby="gait-heading">
<h2 id="gait-heading">Gait parameters</h2>
<div id="gait-parameters"></div>
</section>
<section class="panel-section" aria-labelledby="angles-heading">
<h2 id="angles-heading">Servo angles <span class="unit">°</span></h2>
<table id="tbl"><thead><tr><th>Leg</th><th>coxa</th><th>femur</th><th>tibia</th></tr></thead><tbody></tbody></table>
</section>
<footer class="sub">Use leftstick or wsad to move.<br>View: left button — rotation, scroll wheel — zoom, hold scroll wheel and drag — pan.</footer>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if (!window.THREE) document.getElementById('status').textContent = 'Nie udało się pobrać Three.js. Sprawdź połączenie z Internetem.';</script>
<script src="sim.js"></script>
</body></html>
